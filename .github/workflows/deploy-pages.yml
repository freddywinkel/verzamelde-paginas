name: Controleer en publiceer GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v7
      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Afhankelijkheden installeren
        run: npm ci
      - name: Volledige releasecontrole
        run: npm run release:check
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Pages instellen
        uses: actions/configure-pages@v6
      - name: Pages-artifact uploaden
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Naar GitHub Pages publiceren
        id: deployment
        uses: actions/deploy-pages@v5

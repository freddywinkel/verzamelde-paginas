<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e8ddcb">
    <title>Offline · Freddo's Mementos</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#e8ddcb;color:#302820;font-family:Georgia,serif;text-align:center}.paper{max-width:520px;padding:42px;border:1px solid #ae9c84;background:#fff6e5;box-shadow:0 15px 30px rgba(71,48,31,.13)}h1{font-weight:400}p{color:#6b6157;line-height:1.6}button{min-height:44px;padding:0 18px;border:1px solid #8e4937;border-radius:9px;background:#a9573f;color:#fff;font:700 14px system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="paper">
      <p>FREDDO'S MEMENTOS</p>
      <h1>Je bent offline</h1>
      <p>De app-shell kon niet uit de cache worden geopend. Maak eenmaal verbinding, open de app opnieuw en probeer daarna weer offline.</p>
      <button onclick="location.reload()">Probeer opnieuw</button>
    </main>
  </body>
</html>
